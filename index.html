<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初中语文教师·班主任一体化工作台</title>
<style>
/* ===== Reset & Variables ===== */
:root{
  --blue:#007AFF;--blue-light:#5AC8FA;--blue-dark:#0051D5;--blue-bg:#EAF2FF;
  --green:#34C759;--orange:#FF9500;--red:#FF3B30;--purple:#5856D6;--teal:#5AC8FA;
  --bg:#F0F2F5;--card:#FFFFFF;--text:#1D1D1F;--text2:#86868B;--text3:#C7C7CC;
  --border:#E5E5EA;--sidebar-bg:#FFFFFF;--sidebar-active:#EAF2FF;
  --radius:14px;--radius-lg:20px;--shadow:0 2px 12px rgba(0,0,0,.06);--shadow-lg:0 8px 32px rgba(0,0,0,.12);
  --font:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
.icon-svg{vertical-align:middle;flex-shrink:0;display:inline-block}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;overflow:hidden}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#D1D1D6;border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ===== Setup Modal ===== */
.setup-overlay{position:fixed;inset:0;background:rgba(0,0,40,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:9999;animation:fadeIn .3s}
.setup-card{background:#fff;border-radius:24px;padding:40px;max-width:480px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:slideUp .4s ease}
.setup-card h2{font-size:22px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.setup-card .sub{color:var(--text2);font-size:14px;margin-bottom:28px}
.setup-field{margin-bottom:20px}
.setup-field label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px}
.setup-field select,.setup-field input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;font-family:var(--font);transition:border .2s;outline:none}
.setup-field select:focus,.setup-field input:focus{border-color:var(--blue)}
.setup-segment{display:flex;gap:8px}
.setup-segment button{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:10px;background:#fff;font-size:14px;font-family:var(--font);cursor:pointer;transition:all .2s}
.setup-segment button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.setup-btn{width:100%;padding:14px;background:var(--blue);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;font-family:var(--font);cursor:pointer;transition:background .2s;margin-top:8px}
.setup-btn:hover{background:var(--blue-dark)}

/* ===== Layout ===== */
.app{display:flex;height:100vh}
.sidebar{width:240px;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:20px 18px 14px;border-bottom:1px solid var(--border)}
.sidebar-header .logo{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;color:var(--text)}
.sidebar-header .logo .dot{width:32px;height:32px;background:linear-gradient(135deg,var(--blue),var(--blue-light));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sidebar-header .info{font-size:11px;color:var(--text2);margin-top:6px;padding-left:42px}
.sidebar-nav{flex:1;overflow-y:auto;padding:10px 8px}
.nav-group{margin-bottom:8px}
.nav-group-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;padding:8px 12px 4px;letter-spacing:.5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:14px;color:var(--text);transition:all .15s;margin-bottom:2px}
.nav-item:hover{background:#F5F5FA}
.nav-item.active{background:var(--sidebar-active);color:var(--blue);font-weight:600}
.nav-item .icon{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-item .icon-svg{width:18px;height:18px}
.sidebar-footer{padding:10px 8px;border-top:1px solid var(--border)}
.sidebar-footer .nav-item{font-size:13px;color:var(--text2)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:rgba(255,255,255,.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-left h1{font-size:17px;font-weight:600}
.topbar-left .week-badge{background:var(--blue-bg);color:var(--blue);font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar-date{font-size:13px;color:var(--text2)}
.content{flex:1;overflow-y:auto;padding:20px 24px}

/* ===== Components ===== */
.section-title{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title .actions{margin-left:auto;display:flex;gap:8px}
.card{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title .icon-svg{color:var(--text2)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;border:none;font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-dark)}
.btn-secondary{background:var(--blue-bg);color:var(--blue)}
.btn-secondary:hover{background:#D6E4FF}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--blue);color:var(--blue)}
.btn-danger{background:#FFF0F0;color:var(--red)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-lg{padding:12px 24px;font-size:15px}
.btn-green{background:#E8F8EC;color:var(--green)}
.btn-orange{background:#FFF3E0;color:var(--orange)}
.btn-purple{background:#F0EDFF;color:var(--purple)}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat-card .stat-icon{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.stat-card .stat-label{font-size:12px;color:var(--text2);margin-bottom:6px}
.stat-card .stat-value{font-size:28px;font-weight:700;letter-spacing:-1px}
.stat-card .stat-sub{font-size:11px;color:var(--text3);margin-top:4px}

.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.quick-btn{background:#fff;border-radius:var(--radius);padding:18px 12px;text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:all .2s;border:1.5px solid transparent}
.quick-btn:hover{border-color:var(--blue);transform:translateY(-2px)}
.quick-btn .qi{width:40px;height:40px;border-radius:12px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:20px}
.quick-btn .qt{font-size:13px;font-weight:600}

table{width:100%;border-collapse:collapse}
.tbl{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
.tbl table{width:100%}
.tbl th{background:#F8F9FA;font-size:12px;font-weight:600;color:var(--text2);text-align:left;padding:10px 14px;white-space:nowrap}
.tbl td{padding:10px 14px;border-top:1px solid var(--border);font-size:13px}
.tbl tr:hover td{background:#FAFBFC}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.tag-blue{background:var(--blue-bg);color:var(--blue)}
.tag-green{background:#E8F8EC;color:var(--green)}
.tag-orange{background:#FFF3E0;color:var(--orange)}
.tag-red{background:#FFF0F0;color:var(--red)}
.tag-purple{background:#F0EDFF;color:var(--purple)}
.tag-gray{background:#F5F5FA;color:var(--text2)}

.input,.select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:var(--font);outline:none;transition:border .2s}
.input:focus,.select:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:60px}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:5px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,30,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn .2s}
.modal{background:#fff;border-radius:20px;padding:28px;max-width:600px;width:90%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideUp .3s}
.modal-sm{max-width:420px}
.modal-title{font-size:18px;font-weight:700;margin-bottom:18px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}

.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px}
.empty .ei{font-size:36px;margin-bottom:8px;opacity:.5}
.empty .ei .icon-svg{stroke:var(--text3);width:36px;height:36px}

.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;z-index:9999;animation:slideDown .3s;backdrop-filter:blur(10px)}

.filter-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filter-bar select,.filter-bar input{width:auto;min-width:140px}

/* Schedule Grid */
.schedule-wrap{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;overflow-x:auto}
.schedule-grid{width:100%;border-collapse:collapse;min-width:700px}
.schedule-grid th,.schedule-grid td{border:1px solid var(--border);text-align:center;padding:0}
.schedule-grid th{background:#F8F9FA;padding:10px 6px;font-size:12px;font-weight:600;color:var(--text2)}
.schedule-grid .time-col{width:90px;background:#FAFBFC;font-size:11px;color:var(--text2);padding:8px 4px}
.schedule-grid .cell{height:62px;padding:4px;cursor:pointer;transition:background .15s;position:relative;font-size:12px;vertical-align:top}
.schedule-grid .cell:hover{background:#F5F8FF}
.schedule-grid .cell.has-class{background:var(--blue-bg)}
.schedule-grid .cell.chinese{background:#EAF2FF;border-color:#B3D4FF}
.schedule-grid .cell.chinese .subj{color:var(--blue);font-weight:700}
.schedule-grid .cell .subj{font-size:13px;font-weight:600}
.schedule-grid .cell .meta{font-size:10px;color:var(--text2);margin-top:2px}
.schedule-grid .cell .badge-exp{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--orange)}
.schedule-grid .lunch-row td{background:#FFFBE6;font-size:12px;color:var(--orange);font-weight:600;padding:6px;text-align:center}
.schedule-grid .activity-row td{background:#F0FAF0;font-size:12px;color:var(--green);font-weight:600;padding:6px;text-align:center}

/* Charts */
.chart-wrap{position:relative;height:240px}
.chart-wrap canvas{max-height:240px}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:16px;background:#fff;padding:4px;border-radius:12px;box-shadow:var(--shadow);width:fit-content}
.tab{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);transition:all .15s;border:none;background:none;font-family:var(--font)}
.tab.active{background:var(--blue);color:#fff}

.checkbox{display:flex;align-items:center;gap:6px;cursor:pointer}
.checkbox input{width:16px;height:16px}

.note{font-size:12px;color:var(--text2);padding:8px 12px;background:#F8F9FA;border-radius:8px}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}

/* Progress bar */
.progress{height:6px;background:#F0F0F0;border-radius:3px;overflow:hidden;margin-top:4px}
.progress span{display:block;height:100%;background:var(--blue);border-radius:3px;transition:width .3s}

.list-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:#F8F9FA;margin-bottom:6px}
.list-item .li-main{flex:1}
.list-item .li-title{font-size:14px;font-weight:600}
.list-item .li-sub{font-size:12px;color:var(--text2)}

/* Student card */
.student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.student-card{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);cursor:pointer;transition:all .2s;border:1.5px solid transparent}
.student-card:hover{border-color:var(--blue);transform:translateY(-2px)}
.student-card .avatar{width:40px;height:40px;border-radius:50%;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;margin-bottom:8px}
.student-card .sn{font-size:14px;font-weight:600}
.student-card .si{font-size:12px;color:var(--text2)}

</style>
</head>
<body>

<!-- Setup Modal -->
<div class="setup-overlay" id="setupOverlay" style="display:none">
  <div class="setup-card">
    <h2><svg class="icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--blue);vertical-align:middle;margin-right:6px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>工作台初始化</h2>
    <p class="sub">请设置本学期基础信息，所有"第几周"将以此为准</p>
    <div class="form-grid">
      <div class="form-row">
        <label>本学期年级</label>
        <select id="setupGrade" class="select">
          <option value="六年级">六年级</option>
          <option value="七年级">七年级</option>
          <option value="八年级">八年级</option>
          <option value="九年级">九年级</option>
        </select>
      </div>
      <div class="form-row">
        <label>学期类型</label>
        <div class="setup-segment" id="setupSemester">
          <button class="active" data-val="上学期">上学期</button>
          <button data-val="下学期">下学期</button>
        </div>
      </div>
      <div class="form-row">
        <label>教学周数</label>
        <select id="setupWeeks" class="select">
          <option value="18">18周</option>
          <option value="20" selected>20周</option>
          <option value="21">21周</option>
        </select>
      </div>
      <div class="form-row">
        <label>开学日期</label>
        <input type="date" id="setupStartDate" class="input">
      </div>
    </div>
    <button class="setup-btn" onclick="completeSetup()">进入工作台</button>
  </div>
</div>

<!-- Main App -->
<div class="app" id="app" style="display:none">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="dot"><svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></div>
        <span>语文教师工作台</span>
      </div>
      <div class="info" id="sidebarInfo">加载中…</div>
    </div>
    <nav class="sidebar-nav" id="navContainer">
      <div class="nav-group">
        <div class="nav-group-title">语文教学</div>
        <div class="nav-item active" data-view="dashboard"><span class="icon"><svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span>教学仪表盘</div>
        <div class="nav-item" data-view="reflection"><span class="icon"><svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span>课后反思</div>
        <div class="nav-item" data-view="homework"><span class="icon"><svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></span>作业管理</div>
        <div class="nav-item" data-view="grades"><span class="icon"><svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></span>成绩分析</div>
        <div class="nav-item" data-view="todos"><span class="icon"><svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span>学科待办</div>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">班主任工作</div>
        <div class="nav-item" data-view="students"><span class="icon"><svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>学生名单</div>
        <div class="nav-item" data-view="classroster"><span class="icon"><svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/></svg></span>班级管理</div>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">课表管理</div>
        <div class="nav-item" data-view="schedule-dashboard"><span class="icon"><svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>课表总览</div>

  if(!state.settings.startDate)return 1;

  if(days<0)return 0;
  var week=Math.floor(days/7)+1;
  var max=parseInt(state.settings.teachingWeeks)||20;
  return Math.min(week,max);
}

  if(!d)return '';

}

/* ===== Navigation ===== */
function navigateTo(view){
  currentView=view;
  document.querySelectorAll('.nav-item').forEach(function(n){
    n.classList.toggle('active',n.dataset.view===view)
  });
  var titles={
    'dashboard':'教学仪表盘','reflection':'课后反思','homework':'作业管理',
    'grades':'成绩分析','todos':'学科待办备忘','students':'学生名单管理',
    'classroster':'班级管理','schedule-dashboard':'课表总览',
    'personal-schedule':'个人授课课表','class-schedule':'班级全局课表','swap':'调课管理'
  };
  $('#pageTitle').textContent=titles[view]||'';
  // Destroy charts
  Object.keys(chartInstances).forEach(function(k){if(chartInstances[k]){chartInstances[k].destroy();delete chartInstances[k]}})
  renderView(view);
}
// Expose to window so inline onclick handlers can call it
window.navigateTo=navigateTo;
function renderView(view){
  var c=$('#content');
  c.innerHTML='';
  switch(view){
    case 'dashboard':renderDashboard(c);break;
    case 'reflection':renderReflection(c);break;
    case 'homework':renderHomework(c);break;
    case 'grades':renderGrades(c);break;
    case 'todos':renderTodos(c);break;
    case 'students':renderStudents(c);break;
    case 'classroster':renderClassRoster(c);break;
    case 'schedule-dashboard':renderScheduleDashboard(c);break;
    case 'personal-schedule':renderPersonalSchedule(c);break;
    case 'class-schedule':renderClassSchedule(c);break;
    case 'swap':renderSwap(c);break;
  }
}

/* ===== Setup ===== */
function checkFirstRun(){
  if(!state.settings.startDate){
    showSetupModal();
  }else{
    initApp();
  }
}
function showSetupModal(){
  $('#setupOverlay').style.display='flex';
  // Default to today or Sept 1
  var now=new Date();
  var defaultDate=now.getFullYear()+'-09-01';
  if(now.getMonth()>=8){defaultDate=now.getFullYear()+'-09-01'}else{defaultDate=(now.getFullYear()-1)+'-09-01'}
  $('#setupStartDate').value=defaultDate;
}
window.completeSetup=function(){
  var sem=$('#setupSemester').querySelector('.active').dataset.val;
  state.settings.grade=$('#setupGrade').value;
  state.settings.semester=sem;
  state.settings.teachingWeeks=parseInt($('#setupWeeks').value);
  state.settings.startDate=$('#setupStartDate').value;
  saveState();
  $('#setupOverlay').style.display='none';
  initApp();
  toast('工作台初始化完成');
};
// Segment buttons
document.querySelectorAll('#setupSemester button').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('#setupSemester button').forEach(function(x){x.classList.remove('active')});
    b.classList.add('active');
  });
});

function initApp(){
  $('#app').style.display='flex';
  updateSidebarInfo();
  updateTopbar();
  navigateTo('dashboard');
}
function updateSidebarInfo(){
  var s=state.settings;
  $('#sidebarInfo').textContent=s.grade+' · '+s.semester+' · '+s.teachingWeeks+'周';
}
function updateTopbar(){
  var w=getCurrentWeek();
  $('#weekBadge').textContent=w>0?'第'+w+'周':'未开学';
  var d=new Date();
  var wd='周'+['日','一','二','三','四','五','六'][d.getDay()];
  $('#todayDate').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+wd;
}
window.openSettings=function(){
  // Reuse setup modal for editing
  $('#setupGrade').value=state.settings.grade;
  document.querySelectorAll('#setupSemester button').forEach(function(b){
    b.classList.toggle('active',b.dataset.val===state.settings.semester)
  });
  $('#setupWeeks').value=state.settings.teachingWeeks;
  $('#setupStartDate').value=state.settings.startDate;
  $('#setupOverlay').style.display='flex';
};

/* ===== Modal Helpers ===== */
function showModal(html){
  $('#modalContainer').innerHTML='<div class="modal-overlay" onclick="if(event.target===this)this.parentElement.remove()"><div class="modal">'+html+'</div></div>';
}
function closeModal(){
  $('#modalContainer').innerHTML='';
}

function calcAvgScore(){
  var exams=state.exams.filter(function(e){return e.scores&&e.scores.length>0});
  if(!exams.length)return{score:'—'};
  var latest=exams[exams.length-1];
  var scores=latest.scores.map(function(s){return parseFloat(s.score)||0});
  var avg=scores.length?(scores.reduce(function(a,b){return a+b},0)/scores.length).toFixed(1):'—';
  return{score:avg,exam:latest.name};
}
function calcHwRate(){
  var recent=state.homework.slice(-5);
  if(!recent.length)return 0;
  var total=0,submitted=0;
  recent.forEach(function(h){
    if(h.submissions&&h.submissions.length){
      h.submissions.forEach(function(s){total++;if(s.completed)submitted++})
    }
  });
  return total?Math.round(submitted/total*100):0;
}
function calcPendingGrading(){
  var pending=state.homework.filter(function(h){return h.submissions&&h.submissions.some(function(s){return s.completed&&!s.scored})});
  return{count:pending.length,detail:pending.length?pending[0].title:'暂无待批改'};
}
function calcHighFreqErrors(){
  var errors={};
  state.homework.forEach(function(h){
    if(h.errors){h.errors.forEach(function(e){errors[e]=(errors[e]||0)+1})}
  });
  var sorted=Object.keys(errors).sort(function(a,b){return errors[b]-errors[a]}).slice(0,3);
  return{count:sorted.length,detail:sorted.length?sorted.map(function(e){return e+'('+errors[e]+'次)'}).join('、'):'暂无错题统计'};
}
function getTutoringList(){
  var list=[];
  state.students.forEach(function(s){
    if(s.level==='培优'||s.level==='补差'){list.push({studentId:s.id,type:s.level,reason:s.notes||''})}
  });
  return list;
}
function getUpcomingExams(){
  var today=todayStr();
  var upcoming=state.exams.filter(function(e){return e.date>=today}).sort(function(a,b){return a.date.localeCompare(b.date)});
  if(!upcoming.length)return'';
  var e=upcoming[0];
  var d=new Date(e.date);
  var diff=Math.ceil((d-new Date(today))/(86400000));
  return e.name+'('+diff+'天后)';
}
function getTodoTagClass(type){
  var map={'备课':'tag-blue','命题':'tag-orange','教研':'tag-purple','听课':'tag-green','其他':'tag-gray'};

}

function exportWord(htmlContent,filename){
  var header='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>'+filename+'</title></head><body style="font-family:宋体;font-size:14px">';
  var footer='</body></html>';
  var blob=new Blob(['\ufeff'+header+htmlContent+footer],{type:'application/msword'});
  var link=document.createElement('a');
  link.href=URL.createObjectURL(blob);
  link.download=filename+'.doc';
  link.click();
  setTimeout(function(){URL.revokeObjectURL(link.href)},100);
}

window.importHwExcel=function(input){
  var file=input.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=new Uint8Array(e.target.result);
      var wb=XLSX.read(data,{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var json=XLSX.utils.sheet_to_json(ws);
      json.forEach(function(row){
        state.homework.push({
          id:uid(),
          title:row['作业标题']||'',
          type:{'基础':'base','提升':'advanced','中考专项':'exam'}[row['类型']]||'base',
          chapter:row['章节']||'',class:row['班级']||'',
          assignedDate:row['布置日期']||todayStr(),dueDate:row['截止日期']||todayStr(),
          submissions:state.students.map(function(s){return{studentId:s.id,completed:false,score:''}})
        });
      });
      saveState();
      renderHwTable();
      toast('导入成功，共'+json.length+'条');
    }catch(err){toast('导入失败：'+err.message)}
  };
  reader.readAsArrayBuffer(file);
};
function exportExcel(data,filename){
  var ws=XLSX.utils.json_to_sheet(data);
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Sheet1');
  XLSX.writeFile(wb,filename+'.xlsx');
}

function renderExamTable(){
  var tbody=$('#examTableBody');
  if(!tbody)return;
  if(!state.exams.length){tbody.innerHTML='<tr><td colspan="10"><div class="empty"><div class="ei">'+icon('trend_up',36)+'</div>暂无考试记录</div></td></tr>';return}
  tbody.innerHTML=state.exams.map(function(e){
    var scores=e.scores||[];
    var nums=scores.map(function(s){return parseFloat(s.score)||0});
    var avg=nums.length?(nums.reduce(function(a,b){return a+b},0)/nums.length).toFixed(1):'—';
    var max=nums.length?Math.max.apply(null,nums):'—';
    var min=nums.length?Math.min.apply(null,nums):'—';
    var pass=nums.filter(function(n){return n>=60}).length;
    var passRate=nums.length?Math.round(pass/nums.length*100):0;
    var week=getWeekFromDate(e.date);
    return '<tr><td>'+escapeHtml(e.name)+'</td><td><span class="tag '+({unit:'tag-blue',monthly:'tag-orange',mid:'tag-purple',final:'tag-red',exp:'tag-green'}[e.type]||'tag-gray')+'">'+({unit:'单元测',monthly:'月考',mid:'期中',final:'期末',exp:'实验'}[e.type]||e.type)+'</span></td><td>'+formatDate(e.date)+'</td><td>第'+week+'周</td><td>'+scores.length+'</td><td style="font-weight:700;color:var(--blue)">'+avg+'</td><td style="color:var(--green)">'+max+'</td><td style="color:var(--red)">'+min+'</td><td>'+passRate+'%</td><td><button class="btn btn-sm btn-outline" onclick="showExamModal(\''+e.id+'\')">编辑</button> <button class="btn btn-sm btn-secondary" onclick="showScoreModal(\''+e.id+'\')">成绩</button> <button class="btn btn-sm btn-danger" onclick="delExam(\''+e.id+'\')">删除</button></td></tr>'
  }).join('');
}
function getWeekFromDate(dateStr){
  if(!dateStr||!state.settings.startDate)return 1;
  var start=new Date(state.settings.startDate);
  var d=new Date(dateStr);
  var days=Math.floor((d-start)/86400000);
  if(days<0)return 0;
  return Math.floor(days/7)+1;
}

function renderGradeCharts(){
  // Chart 1: Class average trend
  var exams=state.exams.filter(function(e){return e.scores&&e.scores.length}).sort(function(a,b){return new Date(a.date)-new Date(b.date)});
  var ctx1=document.getElementById('gradeChart1');
  if(ctx1){
    ctx1=ctx1.getContext('2d');
    var labels=exams.map(function(e){return e.name});
    var avgs=exams.map(function(e){
      var sc=e.scores.map(function(s){return parseFloat(s.score)||0});
      return sc.length?(sc.reduce(function(a,b){return a+b},0)/sc.length).toFixed(1):0;
    });
    chartInstances.g1=new Chart(ctx1,{type:'line',data:{labels:labels,datasets:[{label:'均分',data:avgs,borderColor:'#007AFF',backgroundColor:'rgba(0,122,255,.1)',fill:true,tension:.3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:false,min:0,max:100}}}});
  }
  // Chart 2: Knowledge point loss
  var kpData={};
  state.exams.forEach(function(e){
    if(e.knowledgePoints){
      e.knowledgePoints.split(/[,，]/).forEach(function(item){
        var parts=item.trim().split(/[:：]/);
        if(parts.length===2){kpData[parts[0].trim()]=(kpData[parts[0].trim()]||0)+parseInt(parts[1])||0}
      });
    }
  });
  var ctx2=document.getElementById('gradeChart2');
  if(ctx2){
    ctx2=ctx2.getContext('2d');
    var kpLabels=Object.keys(kpData);
    var kpValues=Object.values(kpData);
    if(kpLabels.length){
      chartInstances.g2=new Chart(ctx2,{type:'bar',data:{labels:kpLabels,datasets:[{label:'失分人数',data:kpValues,backgroundColor:'#FF9500',borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
    }else{
      ctx2.canvas.parentElement.innerHTML='<div class="empty"><div class="ei">'+icon('pie',36)+'</div>暂无知识点失分数据</div>';
    }
  }
  // Chart 3: Student tracking
  renderStudentTrack();
}
window.renderStudentTrack=function(){
  var sid=$('#trackStudent')?$('#trackStudent').value:'';
  var ctx3=document.getElementById('gradeChart3');
  if(!ctx3||!sid)return;
  ctx3=ctx3.getContext('2d');
  var exams=state.exams.filter(function(e){return e.scores&&e.scores.length}).sort(function(a,b){return new Date(a.date)-new Date(b.date)});
  var labels=exams.map(function(e){return e.name});
  var scores=exams.map(function(e){var sc=e.scores.find(function(x){return x.studentId===sid});return sc?parseFloat(sc.score)||0:0});
  var classAvgs=exams.map(function(e){var sc=e.scores.map(function(s){return parseFloat(s.score)||0});return sc.length?(sc.reduce(function(a,b){return a+b},0)/sc.length).toFixed(1):0});
  if(chartInstances.g3)chartInstances.g3.destroy();
  chartInstances.g3=new Chart(ctx3,{type:'line',data:{labels:labels,datasets:[{label:'个人成绩',data:scores,borderColor:'#007AFF',backgroundColor:'rgba(0,122,255,.1)',fill:true,tension:.3},{label:'班级均分',data:classAvgs,borderColor:'#34C759',borderDash:[5,5],fill:false,tension:.3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:false,min:0,max:100}}}});
};

  var allTasks=getTodayAllTasks();
  var week=getCurrentWeek();
  c.innerHTML=`
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-icon" style="background:var(--blue-bg);color:var(--blue)">${icon('calendar',20)}</div><div class="stat-label">今日</div><div class="stat-value" style="color:var(--blue);font-size:18px">周${wdName}</div><div class="stat-sub">第${week}周</div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#E8F8EC;color:var(--green)">${icon('book',20)}</div><div class="stat-label">今日语文课</div><div class="stat-value" style="color:var(--green)">${todaySchedule.length}</div><div class="stat-sub">节</div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#FFF3E0;color:var(--orange)">${icon('class2',20)}</div><div class="stat-label">今日总任务</div><div class="stat-value" style="color:var(--orange)">${allTasks.length}</div><div class="stat-sub">含班会/监考</div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#F0EDFF;color:var(--purple)">${icon('refresh',20)}</div><div class="stat-label">本周调课</div><div class="stat-value" style="color:var(--purple)">${state.swapClasses.filter(function(s){return getWeekFromDate(s.date)===week}).length}</div><div class="stat-sub">次调课记录</div></div>
    </div>
    <div class="card">
      <div class="card-title">${icon('list',16)} 今日日程</div>
      ${allTasks.length?allTasks.map(function(t){
        var iconSvg=ICONS[t.iconName]||ICONS.book;
        return '<div class="list-item"><div class="avatar" style="width:36px;height:36px;border-radius:10px;background:'+t.bg+';color:'+t.color+';display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg class="icon-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+iconSvg+'</svg></div><div class="li-main"><div class="li-title">'+escapeHtml(t.title)+'</div><div class="li-sub">第'+t.period+'节 · '+escapeHtml(t.time||'')+'</div></div>'+(t.exp?'<span class="tag tag-orange">实验</span>':'')+(t.swap?'<span class="tag tag-red">调课</span>':'')+'</div>';
      }).join(''):'<div class="empty"><div class="ei">'+icon('calendar',36)+'</div>今日无课程安排</div>'}
    </div>
    <div class="card">
      <div class="card-title">${icon('pie',16)} 本周总日程概览</div>
      <div class="chart-wrap"><canvas id="sdChart"></canvas></div>
    </div>
  `;
  // Week overview chart
  var ctx=document.getElementById('sdChart');
  if(ctx){
    ctx=ctx.getContext('2d');
    var days=['周一','周二','周三','周四','周五'];
    var counts=days.map(function(_,i){
      var dayIdx=i+1;
      var count=0;
      state.personalSchedule.forEach(function(p){if(p.weekDay==dayIdx)count++});
      state.classSchedule.forEach(function(p){if(p.weekDay==dayIdx&&p.subject==='班会')count++});
      return count;
    });
    chartInstances.sd=new Chart(ctx,{type:'bar',data:{labels:days,datasets:[{label:'课程数',data:counts,backgroundColor:'#007AFF',borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,stepSize:1}}}});
  }
}
function getTodayPersonalSchedule(){
  var wd=new Date().getDay();
  if(wd===0||wd===6)return[];
  return state.personalSchedule.filter(function(p){return p.weekDay==wd}).sort(function(a,b){return a.period-b.period});
}
function getTodayAllTasks(){
  var tasks=[];
  var wd=new Date().getDay();
  if(wd===0||wd===6)return tasks;
  // Personal schedule (Chinese classes)
  state.personalSchedule.forEach(function(p){
    if(p.weekDay==wd){
      tasks.push({title:p.subject+' '+(p.chapter||''),period:p.period,time:p.time,iconName:'book',bg:'#EAF2FF',color:'#007AFF',exp:!!p.equipment,swap:false});
    }
  });
  // Class activities (homeroom)
  state.classSchedule.forEach(function(p){
    if(p.weekDay==wd&&(p.subject==='班会'||p.isActivity)){
      tasks.push({title:p.subject,period:p.period,time:p.time,iconName:'class2',bg:'#E8F8EC',color:'#34C759',exp:false,swap:false});
    }
  });
  return tasks.sort(function(a,b){return a.period-b.period});
}

var periodsDefault=[
  {name:'第一节',time:'08:00-08:45'},
  {name:'第二节',time:'08:55-09:40'},
  {name:'第三节',time:'10:00-10:45'},
  {name:'第四节',time:'10:55-11:40'},
  {name:'午读',time:'11:40-12:10'},
  {name:'第五节',time:'14:00-14:45'},
  {name:'第六节',time:'14:55-15:40'},
  {name:'第七节',time:'16:00-16:45'},
  {name:'第八节',time:'16:55-17:40'}
];
function getPeriods(){
  return state.periods||periodsDefault;
}
function renderPersonalSchedule(c){
  var periods=getPeriods();
  var days=['周一','周二','周三','周四','周五'];
  c.innerHTML=`
    <div class="filter-bar">
      <button class="btn btn-primary" onclick="showPeriodModal()">+ 编辑时间</button>
      <button class="btn btn-outline" onclick="exportScheduleImage('personal')">${icon('image',14)} 导出图片</button>

      <table class="schedule-grid">
        <thead><tr><th>时间</th>${days.map(function(d){return'<th>'+d+'</th>'}).join('')}</tr></thead>
        <tbody id="psBody">
          ${renderPeriodRows(periods,'personal')}
        </tbody>
      </table>
    </div>
    <div class="note" style="margin-top:12px">点击空格添加课程，蓝色高亮为语文课，橙色圆点标记实验课需准备器材。</div>
  `;
  bindScheduleCellClick('personal');
}
function renderPeriodRows(periods,type){
  var days=['周一','周二','周三','周四','周五'];
  var html='';
  periods.forEach(function(p,idx){
    html+='<tr>';
    html+='<td class="time-col"><div style="font-weight:600">'+p.name+'</div><div>'+p.time+'</div></td>';
    for(var d=1;d<=5;d++){
      var cell=getScheduleCell(type,d,idx+1);
      var cls='cell';
      if(cell){
        cls+=' has-class';
        if(type==='personal'&&cell.subject&&cell.subject.indexOf('语文')>=0)cls+=' chinese';
      }
      var expBadge=cell&&cell.equipment?'<div class="badge-exp"></div>':'';
      var content=cell?'<div class="subj">'+escapeHtml(cell.subject||'')+'</div>'+(cell.chapter?'<div class="meta">'+escapeHtml(cell.chapter)+'</div>':'')+(cell.equipment?'<div class="meta" style="color:var(--orange)">器材:'+escapeHtml(cell.equipment)+'</div>':''):'';
      html+='<td class="'+cls+'" data-type="'+type+'" data-day="'+d+'" data-period="'+(idx+1)+'">'+expBadge+content+'</td>';
    }
    html+='</tr>';
    // Insert lunch/activity rows
    if(p.name==='第四节'){
      html+='<tr class="lunch-row"><td class="time-col">午间</td><td colspan="5">☀️ 午读时间</td></tr>';
    }
  });
  return html;
}
function getScheduleCell(type,day,period){
  var arr=type==='personal'?state.personalSchedule:state.classSchedule;
  return arr.find(function(p){return p.weekDay==day&&p.period==period});
}
function bindScheduleCellClick(type){
  document.querySelectorAll('.cell[data-type="'+type+'"]').forEach(function(td){
    td.addEventListener('click',function(){
      showScheduleCellModal(type,parseInt(td.dataset.day),parseInt(td.dataset.period));
    });
  });
}
window.showScheduleCellModal=function(type,day,period){
  var cell=getScheduleCell(type,day,period);
  var dayName=['','周一','周二','周三','周四','周五'][day];
  showModal(`
    <div class="modal-title modal-sm">${dayName} · 第${period}节</div>
    <div class="form-row"><label>${type==='personal'?'课程名称':'学科'}</label><input type="text" class="input" id="scSubject" value="${cell?escapeHtml(cell.subject||''):''}" placeholder="${type==='personal'?'如：六语文':'如：数学'}"></div>
    ${type==='personal'?'<div class="form-row"><label>授课章节</label><input type="text" class="input" id="scChapter" value="'+(cell?escapeHtml(cell.chapter||''):'')+'" placeholder="如：《草原》第一课时"></div><div class="form-row"><label>实验器材准备</label><input type="text" class="input" id="scEquipment" value="'+(cell?escapeHtml(cell.equipment||''):'')+'" placeholder="如：无 / 投影仪 / 实验器材"></div>':'<div class="form-row"><label>任课教师</label><input type="text" class="input" id="scTeacher" value="'+(cell?escapeHtml(cell.teacher||''):'')+'" placeholder="任课教师"></div><div class="form-row"><label>类型</label><select class="select" id="scIsActivity"><option value="0" '+(!cell?.isActivity?'selected':'')+'>正课</option><option value="1" '+(cell?.isActivity?'selected':'')+'>班级活动</option></select></div>'}
    <div class="modal-actions">
      ${cell?'<button class="btn btn-danger" onclick="delScheduleCell(\''+type+'\','+day+','+period+')" style="margin-right:auto">删除</button>':''}
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveScheduleCell('${type}',${day},${period})">${cell?'更新':'添加'}</button>
    </div>
  `);
};
window.saveScheduleCell=function(type,day,period){
  var arr=type==='personal'?state.personalSchedule:state.classSchedule;
  var cell=arr.find(function(p){return p.weekDay==day&&p.period==period});
  var data={weekDay:day,period:period,subject:$('#scSubject').value};
  if(type==='personal'){
    data.chapter=$('#scChapter')?.value||'';
    data.equipment=$('#scEquipment')?.value||'';
  }else{
    data.teacher=$('#scTeacher')?.value||'';
    data.isActivity=$('#scIsActivity')?.value==='1';
  }
  if(cell)Object.assign(cell,data);
  else{data.id=uid();arr.push(data)}
  saveState();closeModal();
  if(type==='personal')renderPersonalSchedule($('#content'));
  else renderClassSchedule($('#content'));
  toast('已保存');
};
window.delScheduleCell=function(type,day,period){
  if(!confirm('确定删除此课程？'))return;
  var arr=type==='personal'?state.personalSchedule:state.classSchedule;
  var idx=arr.findIndex(function(p){return p.weekDay==day&&p.period==period});
  if(idx>=0)arr.splice(idx,1);
  saveState();closeModal();
  if(type==='personal')renderPersonalSchedule($('#content'));
  else renderClassSchedule($('#content'));
  toast('已删除');
};
window.showPeriodModal=function(){
  var periods=getPeriods();
  showModal(`
    <div class="modal-title">编辑课时时间</div>
    <div class="note">时间列格式自定义，修改后课表自动更新</div>
    <div id="periodList" style="max-height:400px;overflow-y:auto;margin:12px 0">
      ${periods.map(function(p,i){
        return '<div class="list-item"><input type="text" class="input" style="width:100px" value="'+escapeHtml(p.name)+'" data-pidx="'+i+'" data-field="name"><input type="text" class="input" style="width:140px" value="'+escapeHtml(p.time)+'" data-pidx="'+i+'" data-field="time"></div>';
      }).join('')}
    </div>
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="savePeriods()">保存</button></div>
  `);
};
window.savePeriods=function(){
  var periods=[];
  document.querySelectorAll('[data-pidx]').forEach(function(inp){
    var idx=parseInt(inp.dataset.pidx);
    if(!periods[idx])periods[idx]={};
    periods[idx][inp.dataset.field]=inp.value;
  });
  state.periods=periods;
  saveState();closeModal();
  renderPersonalSchedule($('#content'));
  toast('时间已更新');
};
window.exportScheduleImage=function(type){
  var wrapId=type==='personal'?'personalScheduleWrap':'classScheduleWrap';
  var el=document.getElementById(wrapId);
  if(!el){toast('未找到课表');return}
  html2canvas(el,{backgroundColor:'#ffffff',scale:2}).then(function(canvas){
    var link=document.createElement('a');
    link.href=canvas.toDataURL('image/png');
    link.download=(type==='personal'?'个人授课课表':'班级全局课表')+'.png';
    link.click();
    toast('图片已导出');
  });
};
window.exportScheduleExcel=function(type){
  var periods=getPeriods();
  var days=['周一','周二','周三','周四','周五'];
  var arr=type==='personal'?state.personalSchedule:state.classSchedule;
  var rows=periods.map(function(p,idx){
    var row={'时间':p.name+' '+p.time};
    for(var d=1;d<=5;d++){
      var cell=arr.find(function(x){return x.weekDay==d&&x.period==(idx+1)});
      row[days[d-1]]=cell?(cell.subject+(type==='personal'?(cell.chapter?'('+cell.chapter+')':''):'')):'';
    }
    return row;
  });
  exportExcel(rows,type==='personal'?'个人授课课表':'班级全局课表');
};

/* ===== Class Schedule ===== */
function renderClassSchedule(c){
  var periods=getPeriods();
  var days=['周一','周二','周三','周四','周五'];
  c.innerHTML=`
    <div class="filter-bar">
      <button class="btn btn-outline" onclick="exportScheduleImage('class')">${icon('image',14)} 导出图片</button>
      <button class="btn btn-outline" onclick="exportScheduleExcel('class')">⬇ 导出Excel</button>
      <span class="note">班会、班级活动以绿色底色标记</span>
    </div>
    <div class="schedule-wrap" id="classScheduleWrap">
      <table class="schedule-grid">
        <thead><tr><th>时间</th>${days.map(function(d){return'<th>'+d+'</th>'}).join('')}</tr></thead>
        <tbody>
          ${renderPeriodRows(periods,'class')}
        </tbody>
      </table>
    </div>
    <div class="note" style="margin-top:12px">点击空格添加班级课程，可标记班级活动，快速核查与正课冲突。</div>
  `;
  // Override cell rendering for class schedule activity styling
  bindScheduleCellClick('class');
  // Apply activity styling
  state.classSchedule.forEach(function(cs){
    if(cs.isActivity||cs.subject==='班会'){
      var td=document.querySelector('.cell[data-type="class"][data-day="'+cs.weekDay+'"][data-period="'+cs.period+'"]');
      if(td)td.style.background='#E8F8EC';
    }
  });
}

/* ===== Swap Class Management ===== */
function renderSwap(c){
  var week=getCurrentWeek();
  c.innerHTML=`
    <div class="filter-bar">
      <button class="btn btn-primary" onclick="showSwapModal()">+ 录入调课</button>
      <button class="btn btn-outline" onclick="exportSwapExcel()">⬇ 导出台账</button>
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-icon" style="background:var(--blue-bg);color:var(--blue)">${icon('refresh',20)}</div><div class="stat-label">总调课次数</div><div class="stat-value" style="color:var(--blue)">${state.swapClasses.length}</div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#F0EDFF;color:var(--purple)">${icon('calendar',20)}</div><div class="stat-label">本周调课</div><div class="stat-value" style="color:var(--purple)">${state.swapClasses.filter(function(s){return getWeekFromDate(s.date)===week}).length}</div></div>
    </div>
    <div class="tbl"><table>
      <thead><tr><th>日期</th><th>第几周</th><th>调课类型</th><th>原课</th><th>调入课</th><th>调课双方</th><th>原因</th><th>操作</th></tr></thead>
      <tbody id="swapTableBody"></tbody>
    </table></div>
  `;
  renderSwapTable();
}
function renderSwapTable(){
  var tbody=$('#swapTableBody');
  if(!tbody)return;
  if(!state.swapClasses.length){tbody.innerHTML='<tr><td colspan="8"><div class="empty"><div class="ei">'+icon('refresh',36)+'</div>暂无调课记录</div></td></tr>';return}
  tbody.innerHTML=state.swapClasses.map(function(s){
    return '<tr><td>'+formatDate(s.date)+'</td><td>第'+getWeekFromDate(s.date)+'周</td><td><span class="tag '+({swap:'tag-orange',makeup:'tag-blue',change:'tag-purple'}[s.type]||'tag-gray')+'">'+({swap:'换课',makeup:'补课',change:'调课'}[s.type]||s.type)+'</span></td><td>'+escapeHtml(s.originalClass||'')+'</td><td>'+escapeHtml(s.newClass||'')+'</td><td>'+escapeHtml(s.parties||'')+'</td><td>'+escapeHtml(s.reason||'')+'</td><td><button class="btn btn-sm btn-outline" onclick="showSwapModal(\''+s.id+'\')">编辑</button> <button class="btn btn-sm btn-danger" onclick="delSwap(\''+s.id+'\')">删除</button></td></tr>';
  }).join('');
}
window.showSwapModal=function(id){
  var s=id?state.swapClasses.find(function(x){return x.id===id}):{};
  showModal(`
    <div class="modal-title">${id?'编辑调课':'录入调课/补课'}</div>
    <div class="form-grid">
      <div class="form-row"><label>日期</label><input type="date" class="input" id="swapDate" value="${s.date||todayStr()}"></div>
      <div class="form-row"><label>类型</label><select class="select" id="swapType"><option value="swap" ${s.type==='swap'?'selected':''}>换课</option><option value="change" ${s.type==='change'?'selected':''}>调课</option><option value="makeup" ${s.type==='makeup'?'selected':''}>补课</option></select></div>
      <div class="form-row"><label>原课程</label><input type="text" class="input" id="swapOrig" value="${escapeHtml(s.originalClass||'')}" placeholder="如：周三第3节语文"></div>
      <div class="form-row"><label>调入课程</label><input type="text" class="input" id="swapNew" value="${escapeHtml(s.newClass||'')}" placeholder="如：周五第2节语文"></div>
    </div>
    <div class="form-row"><label>调课双方</label><input type="text" class="input" id="swapParties" value="${escapeHtml(s.parties||'')}" placeholder="如：张老师 ↔ 李老师"></div>
    <div class="form-row"><label>原因</label><textarea id="swapReason" placeholder="调课原因...">${escapeHtml(s.reason||'')}</textarea></div>
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveSwap('${id||''}')">保存</button></div>
  `);
};
window.saveSwap=function(id){
  var data={date:$('#swapDate').value,type:$('#swapType').value,originalClass:$('#swapOrig').value,newClass:$('#swapNew').value,parties:$('#swapParties').value,reason:$('#swapReason').value};
  if(id){var s=state.swapClasses.find(function(x){return x.id===id});if(s)Object.assign(s,data)}
  else{data.id=uid();state.swapClasses.push(data)}
  saveState();closeModal();renderSwapTable();toast('已保存');
  // Auto-update schedule if needed (simplified: just notify)
  if(data.type==='swap'||data.type==='change')toast('调课已录入，请前往课表手动更新');
};
window.delSwap=function(id){if(!confirm('确定删除？'))return;state.swapClasses=state.swapClasses.filter(function(s){return s.id!==id});saveState();renderSwapTable();toast('已删除')};
window.exportSwapExcel=function(){
  if(!state.swapClasses.length){toast('暂无数据');return}
  var rows=state.swapClasses.map(function(s){
    return{'日期':s.date,'第几周':'第'+getWeekFromDate(s.date)+'周','类型':{swap:'换课',makeup:'补课',change:'调课'}[s.type]||s.type,'原课程':s.originalClass,'调入课程':s.newClass,'调课双方':s.parties,'原因':s.reason};
  });
  exportExcel(rows,'调课台账');
};
